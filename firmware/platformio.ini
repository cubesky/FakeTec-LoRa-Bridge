; FakeTec LoRa Serial Bridge firmware
; MCU : nRF52840 (nice!nano / ProMicro nRF52840, Adafruit UF2 bootloader + S140 6.1.1)
; LoRa: Ai-Thinker Ra-01S (SX1268, TCXO)  —  set -DLORA_CHIP_SX1262 for HT-RA62 / Ra-01SH
;
; Build artifacts (in .pio/build/faketec/):
;   firmware.hex  - for SWD / nrfjprog
;   firmware.uf2  - drag & drop into the bootloader drive (Meshtastic web flasher style)
;   firmware.zip  - adafruit-nrfutil DFU package (RNode / rnodeconf / nRF Connect / BLE OTA)

[platformio]
default_envs = faketec

[env:faketec]
platform = nordicnrf52@^10.6.0
board = faketec_nrf52840
framework = arduino
board_build.variants_dir = variants
board_build.variant = faketec

lib_deps =
    jgromes/RadioLib@7.1.2
    olikraus/U8g2@2.35.30

build_flags =
    -DCONFIG_NFCT_PINS_AS_GPIOS=1   ; P0.09 / P0.10 are LoRa RST / DIO1, not NFC
    -DFW_VERSION=\"1.3.0\"
    -Wl,-u,_printf_float
    -DRADIOLIB_EXCLUDE_CC1101=1
    -DRADIOLIB_EXCLUDE_NRF24=1
    -DRADIOLIB_EXCLUDE_RF69=1
    -DRADIOLIB_EXCLUDE_SX1231=1
    -DRADIOLIB_EXCLUDE_SI443X=1
    -DRADIOLIB_EXCLUDE_RFM2X=1
    -DRADIOLIB_EXCLUDE_SX127X=1
    -DRADIOLIB_EXCLUDE_SX128X=1
    -DRADIOLIB_EXCLUDE_LR11X0=1
    -DRADIOLIB_EXCLUDE_AFSK=1
    -DRADIOLIB_EXCLUDE_AX25=1
    -DRADIOLIB_EXCLUDE_HELLSCHREIBER=1
    -DRADIOLIB_EXCLUDE_MORSE=1
    -DRADIOLIB_EXCLUDE_RTTY=1
    -DRADIOLIB_EXCLUDE_SSTV=1
    -DRADIOLIB_EXCLUDE_APRS=1
    -DRADIOLIB_EXCLUDE_BELL=1
    -DRADIOLIB_EXCLUDE_FSK4=1
    -DRADIOLIB_EXCLUDE_PAGER=1
    -DRADIOLIB_EXCLUDE_LORAWAN=1
    -DRADIOLIB_EXCLUDE_DIRECT_RECEIVE=1
build_src_flags = -Wall -Wno-unused-function

extra_scripts = post:scripts/make_packages.py

upload_protocol = nrfutil
monitor_speed = 115200
